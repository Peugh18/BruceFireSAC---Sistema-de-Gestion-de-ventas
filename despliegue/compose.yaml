# Todo el sistema en una sola máquina: web (HTTPS automático), cola, tareas
# programadas y base de datos. Las claves viven en secretos/app.env (no se suben).
name: brucefire

x-app: &app
    build:
        context: ..
        dockerfile: despliegue/Dockerfile
    image: brucefire-app
    env_file: secretos/app.env
    restart: unless-stopped
    depends_on:
        db:
            condition: service_healthy
    volumes:
        - storage:/app/storage
        - ./secretos/certificados:/run/secrets/certificados:ro

services:
    web:
        <<: *app
        environment:
            SERVER_NAME: ${DOMINIO}
        ports:
            - '80:80'
            - '443:443'
            - '443:443/udp'
        volumes:
            - storage:/app/storage
            - ./secretos/certificados:/run/secrets/certificados:ro
            - caddy_data:/data
            - caddy_config:/config

    # Envíos a SUNAT, correos y demás trabajos en segundo plano.
    cola:
        <<: *app
        command:
            [
                'php',
                'artisan',
                'queue:work',
                '--sleep=3',
                '--tries=3',
                '--max-time=3600',
            ]
        # The inherited FrankenPHP check targets Caddy, which is not running
        # in this CLI container. Check that Laravel's worker is PID 1 instead.
        healthcheck:
            test:
                [
                    'CMD',
                    'php',
                    '-r',
                    'exit(str_contains(file_get_contents("/proc/1/cmdline"), "queue:work") ? 0 : 1);',
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s

    # Programador: envíos diferidos a SUNAT, respaldo diario, vencimientos.
    tareas:
        <<: *app
        command: ['php', 'artisan', 'schedule:work']
        # This is also a CLI process, so check its own command rather than Caddy.
        healthcheck:
            test:
                [
                    'CMD',
                    'php',
                    '-r',
                    'exit(str_contains(file_get_contents("/proc/1/cmdline"), "schedule:work") ? 0 : 1);',
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s

    db:
        image: mysql:8.4
        restart: unless-stopped
        env_file: secretos/db.env
        volumes:
            - mysql:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '--silent']
            interval: 5s
            timeout: 5s
            retries: 30

volumes:
    storage:
    mysql:
    caddy_data:
    caddy_config:
